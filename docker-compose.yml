services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: apw
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: apw
    volumes:
      - /srv/apw/pg:/var/lib/postgresql/data   # على القرص المشفّر
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apw"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APW_DATABASE_URL: postgresql+psycopg://apw:${PG_PASSWORD}@db:5432/apw
      APW_DATA_DIR: /srv/data
    volumes:
      - /srv/apw/data:/srv/data                 # الملفات المشفّرة
      - ./secrets:/srv/secrets:ro               # ملف حساب خدمة FCM
    # لا منفذ مفتوح على المضيف: الوصول فقط عبر النفق

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on: [api]
